services:
  s3manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: s3manager
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      DB_FILE_NAME: /app/storage/local.db
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
